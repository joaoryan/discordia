name = "discordia-signal"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "INBOXES"
class_name = "Inbox"

# Só o backend SQLite existe no plano gratuito.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Caixas de entrada para convites e mensagens entre amigos.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Inbox"]

[vars]
# Origens permitidas, separadas por vírgula. Vazio libera tudo (só para desenvolvimento).
ALLOWED_ORIGINS = "https://discordia-six.vercel.app,app://discordia"
RATE_LIMIT_PER_MIN = "30"
METERED_APP = "discordia-call"
# Usuário e senha do ExpressTURN vão como segredos (EXPRESSTURN_USER e EXPRESSTURN_PASS).
EXPRESSTURN_SERVER = "free.expressturn.com:3478"
