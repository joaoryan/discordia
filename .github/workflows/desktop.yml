# Gera o app de computador para Windows e Linux a cada tag v*, e publica no Release do GitHub.
# O app atualiza sozinho a partir desses Releases (electron-updater), e o botão do site baixa dali.
name: App de computador

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Cria o rascunho antes, para os dois sistemas enviarem para o mesmo Release.
  release:
    runs-on: ubuntu-latest
    steps:
      - run: gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Discordia $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A versão do app sai da tag (v1.2.0 → 1.2.0), para bater com o Release.
      - name: Versão da tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Compilar e publicar
        run: npm run desktop:dist -- --publish always
        env:
          # Endereço do Worker de sinalização e do site (para o link de convite).
          VITE_SIGNAL_URL: ${{ vars.VITE_SIGNAL_URL }}
          VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura: sem os segredos abaixo o app sai sem assinatura (aviso do Windows).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

  # Só publica quando os instaladores estão lá: o botão do site nunca aponta para um arquivo que falta.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
